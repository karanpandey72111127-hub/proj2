<template>
    <lightning-card title="Players" icon-name="standard:contact">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-wrap slds-gutter slds-p-bottom_medium">
                <div class="slds-col slds-size_1-of-4 ">
                    <lightning-input label="search" onchange={handleSearch} placeholder="Search using some text" value={searchText}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-4 ">
                    <lightning-combobox name="filterByCountry" label="Filter By" value={categoryCountry} placeholder="Select the country to Filter" options={categoryCountryOptions} onchange={handleCategoryCountry}>
                    </lightning-combobox>
                </div> 
                <div class="slds-col slds-size_1-of-4 ">
                    <lightning-combobox name="filterByPosition" label="Filter By" value={categoryPosition} placeholder="Select the position to Filter" options={categoryPositionOptions} onchange={handleCategoryPosition}>
                    </lightning-combobox>
                </div>    
                <div class="slds-col slds-size_1-of-4 ">
                    <lightning-combobox name="SortBy" label="Sort By" value={sortBy} placeholder="Select field to sort by" options={sortOptions} onchange={handleSort}>
            </lightning-combobox>
                </div>     
            </div>    
        </div>
        <lightning-datatable data={filteredData} columns={columns} key-field="id" hide-checkbox-column="true"></lightning-datatable>    
        </lightning-card>
</template>
